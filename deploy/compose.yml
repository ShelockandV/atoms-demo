services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    volumes:
      - ../backend/config/application-production.yml:/app/config/application-production.yml:ro
    secrets:
      - source: db_password
        target: spring.datasource.password
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: atoms
      MYSQL_USER: atoms
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
    secrets:
      - db_password
      - root_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

secrets:
  db_password:
    file: ../backend/config/spring.datasource.password
  root_password:
    file: ../backend/config/mysql-root-password
volumes:
  mysql-data:
  caddy-data:
  caddy-config:
