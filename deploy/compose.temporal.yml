services:
  temporal:
    image: ${ATOMS_TEMPORAL_IMAGE:-temporalio/temporal:latest}
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/atoms.db"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  temporal-data:
