# Railway injects PORT and service variables. Secrets are set in Railway, not Git.
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
atoms:
  demo: false
  model:
    base-url: ${MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${MODEL_API_KEY:}
    name: ${MODEL_NAME:qwen-plus}
    timeout-seconds: ${MODEL_TIMEOUT_SECONDS:300}
    max-output-tokens: ${MODEL_MAX_OUTPUT_TOKENS:16000}
    image:
      endpoint: ${IMAGE_ENDPOINT:}
      api-key: ${IMAGE_API_KEY:}
      default-model: ${IMAGE_MODEL:qwen-image-2.0}
